# Netlify config: hosts the wedding website as a static site. No build step.
# Netlify dashboard -> Add new site -> Import from Git -> pick this repo; the settings below are read automatically.
[build]
  publish = "."
  command = ""

# Always fetch fresh pages/scripts so guests never see an outdated version.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep working files (client checklist, notes, scripts) off the public site.
[[redirects]]
  from = "/Wedding-Details-Needed-v2.docx"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/Wedding-Details-Needed.docx"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/render.yaml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true
